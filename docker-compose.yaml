version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-library_db}
      POSTGRES_USER: ${DB_USERNAME:-library_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library_password}
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library-network

  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --save "" --appendonly no

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-api
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - .env.docker:/var/www/html/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - library-network

networks:
  library-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
